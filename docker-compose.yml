version: "3.9"

services:
  addition-ms:
    build:
      context: .
      dockerfile: addition_ms/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  multiply-ms:
    build:
      context: .
      dockerfile: multiply_ms/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  calc-cdu:
    build:
      context: .
      dockerfile: calc_cdu/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    depends_on:
      addition-ms:
        condition: service_healthy
      multiply-ms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
